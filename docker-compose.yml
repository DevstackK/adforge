name: adforge
services:
  postgres:
    image: postgres:17-alpine
    environment:
      {
        POSTGRES_USER: adforge,
        POSTGRES_PASSWORD: adforge,
        POSTGRES_DB: adforge,
      }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U adforge"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: [redis-data:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      {
        test: ["CMD", "mc", "ready", "local"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: { minio: { condition: service_healthy } }
    volumes: ["./minio-cors.json:/config/cors.json:ro"]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/adforge && mc cors set local/adforge /config/cors.json",
      ]
  migrate:
    build: { context: ., target: builder }
    command: npm run db:migrate
    env_file: ${ADFORGE_ENV_FILE:-.env}
    environment:
      {
        DATABASE_URL: postgresql://adforge:adforge@postgres:5432/adforge?schema=public,
      }
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., target: runner }
    env_file: ${ADFORGE_ENV_FILE:-.env}
    environment:
      {
        DATABASE_URL: postgresql://adforge:adforge@postgres:5432/adforge?schema=public,
        REDIS_URL: redis://redis:6379,
        S3_ENDPOINT: http://minio:9000,
      }
    ports: ["3000:3000"]
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
        minio-init: { condition: service_completed_successfully },
      }
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    env_file: ${ADFORGE_ENV_FILE:-.env}
    environment:
      {
        DATABASE_URL: postgresql://adforge:adforge@postgres:5432/adforge?schema=public,
        REDIS_URL: redis://redis:6379,
        S3_ENDPOINT: http://minio:9000,
      }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
        minio-init: { condition: service_completed_successfully },
      }
    restart: unless-stopped
volumes: { postgres-data: {}, redis-data: {}, minio-data: {} }

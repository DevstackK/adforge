name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adforge
          POSTGRES_PASSWORD: adforge
          POSTGRES_DB: adforge_test
        ports:
          - "5432:5432"
        options: --health-cmd "pg_isready -U adforge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://adforge:adforge@localhost:5432/adforge_test?schema=public
      TEST_DATABASE_URL: postgresql://adforge:adforge@localhost:5432/adforge_test?schema=public
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_YWRmb3JnZS1jaS5jbGVyay5hY2NvdW50cy5kZXYk' }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_adforge_ci_not_for_production' }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_ORGANIZATION_ID: ${{ secrets.E2E_CLERK_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-artifacts
          path: |
            coverage
            playwright-report
            test-results
          if-no-files-found: ignore
  docker:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runner, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: "adforge-ai:${{ matrix.target }}-${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
